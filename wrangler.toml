# SHAKTI on Cloudflare Workers (static PWA + /api proxy to Railway)
name = "shakti-raj"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Set ONLY in dashboard (Settings → Variables → API_URL).
# Never commit backend URLs here — dashboard value always wins.
[vars]
API_URL = ""
