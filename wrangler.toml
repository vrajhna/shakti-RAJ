# SHAKTI on Cloudflare Workers (static PWA + /api proxy to Railway)
name = "shakti-raj"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# IMPORTANT: set API_URL in Cloudflare dashboard (Worker → Settings → Variables).
# Do NOT define [vars] here — wrangler uploads toml vars on every deploy and
# would overwrite/reset the dashboard value. Dashboard-only = persists forever.

