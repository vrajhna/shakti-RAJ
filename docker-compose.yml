services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shakti
      POSTGRES_PASSWORD: ${PG_PASSWORD:-shakti_strong_pw_2026}
      POSTGRES_DB: shakti
    ports:
      - "5433:5432"
    volumes:
      - shakti-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shakti"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3101
      DATABASE_URL: postgres://shakti:${PG_PASSWORD:-shakti_strong_pw_2026}@postgres:5432/shakti
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-shakti-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:4173}
      META_API_KEY: ${META_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
    ports:
      - "3101:3101"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shakti-pg:
